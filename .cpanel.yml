---
deployment:
  tasks:
    - export DEPLOYPATH="/home2/studiojp/public_html/"
    - /bin/mkdir -p "${DEPLOYPATH}output/pdf/"
    - /bin/cp -R styles.css main.js favicon.png jpb-monogram.png jpb-logo-lockup.png "$DEPLOYPATH"
    - /bin/cp -R photos "$DEPLOYPATH"
    - /bin/cp -R fonts services projects studio-credits international-projects live-sound-engineer orchestra-sound-engineer recording-engineer mixing-mastering broadcast-audio-engineer studio-system-integration "$DEPLOYPATH"
    - /bin/cp output/pdf/jean-pierre-boutros-profile.pdf "${DEPLOYPATH}output/pdf/"
    - /bin/sh hosting/install-seo.sh "$DEPLOYPATH" "/home2/studiojp/repositories/jeanpierreboutros.com/.deployment-backups"
    - /bin/cp index.html robots.txt sitemap.xml llms.txt "$DEPLOYPATH"
